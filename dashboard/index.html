<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Remote Screen QR — Operator Dashboard</title>
<style>
  body { font-family: system-ui, sans-serif; background: #101820; color: #eef;
         margin: 0; padding: 24px; display: flex; gap: 24px; flex-wrap: wrap; }
  .card { background: #1b2735; border-radius: 12px; padding: 20px; flex: 1; min-width: 320px; }
  h1 { font-size: 1.2rem; margin-top: 0; }
  #qr { max-width: 100%; border-radius: 8px; }
  #screen { width: 100%; background: #000; border-radius: 8px; }
  .row { margin: 8px 0; }
  input { width: 100%; padding: 8px; border-radius: 6px; border: none; box-sizing: border-box; }
  button { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer;
           background: #0f4c81; color: #fff; margin-right: 8px; }
  button:hover { background: #1668ab; }
  #status { color: #9ab; }
  .qr-controls label { display: block; font-size: .85rem; margin: 6px 0 2px; }
  .qr-controls select, .qr-controls input[type=color] { padding: 4px; }
</style>
</head>
<body>

<div class="card">
  <h1>1. Pair Device (QR)</h1>
  <div class="row"><input id="deviceId" placeholder="device-01" value="device-01" /></div>
  <button id="pairBtn">Generate Pairing QR</button>
  <div class="row"><img id="qr" alt="Pairing QR" hidden /></div>

  <div class="qr-controls">
    <label>Dot color <input type="color" id="dotColor" value="#0f4c81" /></label>
    <label>Corner color <input type="color" id="cornerColor" value="#e94f37" /></label>
    <label>Dot style
      <select id="dotStyle">
        <option value="rounded">rounded</option>
        <option value="dots">dots</option>
        <option value="classy">classy</option>
        <option value="square">square</option>
      </select>
    </label>
    <button id="restyleBtn" style="margin-top:10px">Re-style QR</button>
  </div>
  <p id="status">Generate a QR, then scan it with the Android app.</p>
</div>

<div class="card">
  <h1>2. Live Screen</h1>
  <canvas id="screen" width="720" height="1280"></canvas>
  <div class="row" style="margin-top:12px">
    <button id="connectBtn">Connect Viewer</button>
    <button id="disconnectBtn">Disconnect</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0/lib/qr-code-styling.min.js"></script>
<script src="viewer.js"></script>
</body>
</html>
